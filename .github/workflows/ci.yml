name: <3 CI

on:
  push:
    branches: ["main", "master", "feat/*"]
  pull_request:
    branches: ["main", "master"]

# Задача только читает репозиторий: права на запись workflows не дают ничего полезного.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Bytecode syntax check
        run: python -m compileall -q ai bot core database filters tools web scripts cli.py main.py config.py
      - name: Shell helper syntax check
        run: bash -n scripts/apply_to_repo.sh
      - name: Console entry point smoke
        run: |
          heart3 --help
          heart3 platforms
      - name: Run full pytest suite
        run: pytest -v
      - name: Run stdlib unittest suite
        run: python -m unittest discover -s tests -p "test_stdlib_*.py" -v

  packaging:
    # Установка НЕ в editable-режиме из другого каталога: только так видно, что колёсу хватает
    # объявленных зависимостей и что страницы панели реально попали в package-data.
    name: Non-editable install from a foreign directory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install built distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Verify the installed package
        run: python scripts/check_packaging.py

name: <3 CI

on:
  push:
    branches: ["main", "master", "feat/*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Bytecode syntax check
        run: python -m compileall -q ai bot core database filters tools web scripts cli.py main.py config.py
      - name: Run full pytest suite
        run: pytest -v
      - name: Run stdlib unittest suite
        run: python -m unittest discover -s tests -p "test_stdlib_*.py" -v

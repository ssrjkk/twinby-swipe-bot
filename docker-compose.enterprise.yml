services:
  heart3-app:
    build: .
    container_name: heart3-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - WEB_HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:////app/data/heart3.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    container_name: heart3-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    profiles: ["enterprise"]

  postgres:
    image: pgvector/pgvector:pg16
    container_name: heart3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: heart3
      POSTGRES_PASSWORD: heart3_secret_password
      POSTGRES_DB: heart3_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heart3 -d heart3_db"]
      interval: 15s
      timeout: 5s
      retries: 5
    profiles: ["enterprise"]

volumes:
  pg_data:
  redis_data:
